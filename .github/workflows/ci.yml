name: ci

on:
  push:
  pull_request:

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"

      - name: Install z3 (proof discharge)
        run: pip install z3-solver

      # v0.141 — 双端业务统计对账进 CI（Python /stats + Rust --app-smoke）
      - name: ΣLang stats reconciliation (v0.141)
        run: |
          python3 impl/python/sigma_app.py --stats-test
          cd impl/verifier && cargo run -q -- --app-smoke

      # v0.151 — 金融市场对账进 CI（Python /portfolio-test）
      - name: ΣLang portfolio reconciliation (v0.151)
        run: python3 impl/python/sigma_app.py --portfolio-test

      # v0.161 — 供应链对账进 CI（Python /inventory-test）
      - name: ΣLang inventory reconciliation (v0.161)
        run: python3 impl/python/sigma_app.py --inventory-test

      # v0.171 — 跨域链对账进 CI（Python /cross-domain-test）
      - name: ΣLang cross-domain reconciliation (v0.171)
        run: python3 impl/python/sigma_app.py --cross-domain-test

      # v0.181 — 错误边界对账进 CI（Python /errors-test）
      - name: ΣLang errors reconciliation (v0.181)
        run: python3 impl/python/sigma_app.py --errors-test

      # v0.191 — 积分链对账进 CI（Python /points-test）
      - name: ΣLang points reconciliation (v0.191)
        run: python3 impl/python/sigma_app.py --points-test

      # v0.201 — 库存链对账进 CI（Python /inventory-chain-test）
      - name: ΣLang inventory-chain reconciliation (v0.201)
        run: python3 impl/python/sigma_app.py --inventory-chain-test

      # v0.211 — 信用链对账进 CI（Python /credit-test）
      - name: ΣLang credit reconciliation (v0.211)
        run: python3 impl/python/sigma_app.py --credit-test

      # v0.221 — 全流程对账进 CI（Python /full-test）
      - name: ΣLang full-flow reconciliation (v0.221)
        run: python3 impl/python/sigma_app.py --full-test

      # v0.231 — 审计对账进 CI（Python /audit-test）
      - name: ΣLang audit reconciliation (v0.231)
        run: python3 impl/python/sigma_app.py --audit-test

      # v0.241 — 贡献分对账进 CI（Python /contribution-test）
      - name: ΣLang contribution reconciliation (v0.241)
        run: python3 impl/python/sigma_app.py --contribution-test

      # v0.251 — 额度链对账进 CI（Python /quota-flow-test）
      - name: ΣLang quota reconciliation (v0.251)
        run: python3 impl/python/sigma_app.py --quota-flow-test

      # v0.261 — 勋章链对账进 CI（Python /badge-test）
      - name: ΣLang badge reconciliation (v0.261)
        run: python3 impl/python/sigma_app.py --badge-test

      # v0.271 — 库存流转对账进 CI（Python /inventory-flow-test）
      - name: ΣLang inventory-flow reconciliation (v0.271)
        run: python3 impl/python/sigma_app.py --inventory-flow-test

      # v0.281 — 组合流转对账进 CI（Python /portfolio-flow-test）
      - name: ΣLang portfolio-flow reconciliation (v0.281)
        run: python3 impl/python/sigma_app.py --portfolio-flow-test

      # v0.56 — 九道门禁一键验收：consensus / p0 / 三端自检与编译 / 三域审计 /
      # 证明消解 / 找茬冒烟，一条命令在 CI 上全绿才算通过。
      # v0.87 — --report 输出全量回归报告（JSON），作为 CI artifact 保存。
      - name: ΣLang one-command acceptance (sigma-accept.py)
        run: python3 tools/sigma-accept.py --report acceptance.json

      - name: Upload acceptance report (v0.87)
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: acceptance.json
