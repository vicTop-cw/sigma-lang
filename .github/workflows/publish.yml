# ΣLang 发布 workflow (v0.129)
# push 形如 v* 的 tag 时自动触发：
#   1. 构建 Python 包（sdist + wheel，pyproject.toml 打包 sigma_core）
#   2. 冒烟测试构建产物（装 wheel 后 import sigma_core）
#   3. 创建 GitHub Release 并附上构建产物
# PyPI 发布预留：配好 PYPI_TOKEN secret（或启用 trusted publishing）后取消注释。

name: Publish ΣLang release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 创建 GitHub Release + 上传资产
      id-token: write        # 可选：PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke-test the built package
        run: |
          pip install dist/*.whl
          python -c "import sigma_core; print(sigma_core.task_create(7, 100))"

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # PyPI 发布（可选）：配好 PYPI_TOKEN secret 后取消注释
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
