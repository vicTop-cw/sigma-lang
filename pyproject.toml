[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-lang"
version = "0.7.5"
description = "AI-Native Semantic Protocol — deterministic business rules verified across Python/Rust/Elixir, with a runnable 找茬 reference product"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["AI", "protocol", "semantics", "verifier", "business-rules"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools]
py-modules = ["sigma_core"]
package-dir = { "" = "impl/python" }
